<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#15100B">
<title>Escalations desk</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
:root{--walnut:#15100B;--walnut-2:#1E1710;--walnut-3:#2A2017;--rule:#4A3B2B;--cream:#F3EBDA;--brass:#CDB991;--brass-dim:#9C8B6C;--amber:#F6A828;--amber-deep:#C97E0B;--ink:#1B140D;--ok:#8FBF7F;--bad:#E08A6B;
--serif:"Bodoni Moda","Didot",Georgia,serif;--sans:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--walnut);color:var(--cream);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;accent-color:var(--amber)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.btn{background:var(--amber);color:var(--ink);border:0;border-radius:999px;padding:9px 20px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn--ghost{background:transparent;color:var(--cream);border:1px solid var(--rule)}
.btn--ghost:hover{border-color:var(--brass)}
.btn--sm{padding:5px 13px;font-size:13px}
.field{width:100%;background:var(--walnut-2);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.field:focus{border-color:var(--amber);outline:none}
/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login form{width:min(380px,100%);display:grid;gap:14px}
.login h1{font:700 28px var(--serif);margin:0}
.login p{margin:0;color:var(--brass)}
.err{color:var(--bad);min-height:1.4em;margin:0}
/* app */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.bar{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--rule);background:var(--walnut-2);flex-wrap:wrap}
.bar h1{font:700 19px var(--serif);margin:0;margin-right:8px}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--brass);font-weight:600}
.tab[aria-selected=true]{background:var(--amber);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--bad);color:var(--ink);font-size:12px;font-weight:700;text-align:center}
.tab[aria-selected=true] .badge{background:var(--ink);color:var(--amber)}
.bar .sp{flex:1}
.panes{display:grid;grid-template-columns:minmax(280px,380px) 1fr;min-height:0}
.list{border-right:1px solid var(--rule);overflow:auto;min-height:0}
.filters{display:flex;gap:8px;padding:10px 12px;position:sticky;top:0;background:var(--walnut);border-bottom:1px solid var(--rule);z-index:1}
.filters .field{padding:7px 10px}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 14px;cursor:pointer}
.row:hover{background:var(--walnut-2)}
.row[aria-current=true]{background:var(--walnut-3);box-shadow:inset 3px 0 var(--amber)}
.row__top{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--brass-dim)}
.row__who{font-weight:700;color:var(--cream);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__sub{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__pre{font-size:13px;color:var(--brass-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--rule);color:var(--brass)}
.pill--open{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.pill--answered{border-color:var(--ok);color:var(--ok)}
.pill--esc{border-color:var(--amber);color:var(--amber)}
.empty{padding:28px 18px;color:var(--brass-dim)}
.view{overflow:auto;min-height:0;padding:20px clamp(16px,3vw,36px) 40px}
.view__head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.view__head h2{font:700 22px/1.25 var(--serif);margin:0 0 4px}
.meta{color:var(--brass);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:none}
.msg{max-width:760px;margin:0 0 14px;border:1px solid var(--rule);border-radius:12px;background:var(--walnut-2)}
.msg--toby{margin-left:auto;border-color:var(--amber-deep);background:#2A1E0C}
.msg--bot{background:var(--walnut)}
.msg--pending{border-style:dashed;border-color:var(--amber)}
.msg--cancelled{opacity:.55}.msg--cancelled .msg__b{text-decoration:line-through}
.pill--wait{border-color:var(--amber);color:var(--amber)}
.msg__h{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--brass-dim)}
.msg__h b{color:var(--cream);letter-spacing:.04em;text-transform:uppercase}
.msg__b{padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg__g{padding:0 14px 12px;font-size:13px;color:var(--brass)}
.atts{display:grid;gap:6px;padding:0 14px 12px}
.att{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.att .name{font-weight:700;overflow-wrap:anywhere}
.att button.name{background:none;border:0;padding:0;color:var(--cream);text-decoration:underline;cursor:pointer;font:inherit;font-weight:700;text-align:left}
.att small{color:var(--brass-dim)}
.att a{color:var(--brass)}
.files{display:grid;gap:6px;padding:8px 0}
.held{max-width:760px;margin-top:22px;border:1px solid var(--amber);border-radius:10px;background:var(--walnut-2);display:grid;gap:8px;padding:12px 0 14px}
.held h3{margin:0;padding:0 14px;font:700 16px var(--serif)}
.held .hint{margin:0;padding:0 14px}
.held>button{justify-self:start;margin:0 14px}
dialog.viewer{width:min(920px,94vw);max-height:92vh;padding:0;border:1px solid var(--rule);border-radius:14px;background:var(--walnut-2);color:var(--cream);overflow:hidden}
dialog.viewer::backdrop{background:rgba(10,7,4,.78)}
.viewer__in{display:grid;grid-template-rows:auto auto 1fr;max-height:92vh}
.viewer__head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.viewer__head h3{margin:0;font:700 16px var(--serif);overflow-wrap:anywhere;flex:1 1 220px}
.viewer__head a{color:var(--brass)}
.viewer__tabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--rule)}
.viewer__tabs button[aria-current=true]{border-color:var(--amber);color:var(--amber)}
.viewer__body{overflow:auto;padding:16px;min-height:200px;display:grid;place-items:center;background:var(--walnut)}
.viewer__body img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:6px}
.viewer__body iframe{width:100%;height:70vh;border:0;background:#fff;border-radius:6px}
.viewer__body pre{margin:0;width:100%;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,Menlo,monospace;align-self:start}
.viewer__body p{margin:0;color:var(--brass);text-align:center;max-width:46ch}
.composer{max-width:760px;margin-top:22px;border-top:1px solid var(--rule);padding-top:18px;display:grid;gap:12px}
.composer h3{margin:0;font:700 17px var(--serif)}
.composer textarea{min-height:170px;resize:vertical}
.act{margin:0 0 14px;border:1px solid var(--rule);border-radius:10px}
.act summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px}
.act ul{list-style:none;margin:0;padding:0 14px 10px}
.act li{padding:8px 0;border-top:1px solid var(--rule);font-size:13px}
.act li .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act li time{color:var(--brass-dim);font-variant-numeric:tabular-nums}
.act li small{display:block;color:var(--brass-dim);margin-top:2px}
.pay table{width:100%;border-collapse:collapse;font-size:13px}
.pay th,.pay td{text-align:left;padding:6px 8px;border-top:1px solid var(--rule);vertical-align:middle}
.pay form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px 12px}
.pay .tbl{padding:0 14px 10px;overflow-x:auto}
.hint{font-size:12px;color:var(--brass-dim);margin:0}
.guiderow{display:flex;gap:8px;flex-wrap:wrap}
.guiderow select{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--walnut-3);border:1px solid var(--rule);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px}
.chip button{background:none;border:0;cursor:pointer;color:var(--brass);padding:0 6px;font-size:15px}
.send{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note{padding:12px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--walnut-2);margin:16px;color:var(--brass)}
.gsearch{position:relative}
.gresults{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:4px;background:var(--walnut-2);border:1px solid var(--rule);border-radius:10px;max-height:320px;overflow:auto;box-shadow:0 12px 30px #0008}
.gres{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 12px;cursor:pointer}
.gres:last-child{border-bottom:0}.gres:hover,.gres[aria-selected=true]{background:var(--walnut-3)}
.gres b{display:block}.gres small{display:block;color:var(--brass-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gres mark{background:var(--amber);color:var(--ink);border-radius:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools select{flex:1;min-width:200px}
.send .btn--done{background:var(--ok);color:var(--ink)}
.set{max-width:860px;display:grid;gap:14px}
.set h2{font:700 20px var(--serif);margin:12px 0 0}
.set textarea{min-height:420px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.set .num{width:90px}.set label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.app[data-tab=settings] .panes{grid-template-columns:1fr}.app[data-tab=settings] .list{display:none}
@media(max-width:820px){
 .panes{grid-template-columns:1fr}
 .list{border-right:0}
 .app[data-open=true] .list{display:none}
 .app:not([data-open=true]) .view{display:none}
 .back{display:inline-flex}
}
.app[data-tab=settings] .view{display:block}
</style>
</head>
<body>
<section class="login" id="login">
  <form id="loginForm" autocomplete="off">
    <h1>Escalations desk</h1>
    <p>Enter the desk password.</p>
    <input class="field" id="pw" type="password" autocomplete="current-password" aria-label="Password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" type="submit">Open the desk</button>
  </form>
</section>

<div class="app" id="app" hidden>
  <header class="bar">
    <h1>Escalations desk</h1>
    <div class="tabs" role="tablist" aria-label="Desk">
      <button class="tab" role="tab" id="tab-esc" aria-selected="true" data-tab="esc">Escalations<span class="badge" id="openCount" hidden>0</span></button>
      <button class="tab" role="tab" id="tab-all" aria-selected="false" data-tab="all">Support chains</button>
      <button class="tab" role="tab" id="tab-set" aria-selected="false" data-tab="settings">Settings</button>
    </div>
    <span class="sp"></span>
    <button class="btn btn--sm" id="compose" type="button">New email</button>
    <button class="btn btn--ghost btn--sm" id="refresh" type="button">Refresh</button>
    <button class="btn btn--ghost btn--sm" id="signout" type="button">Sign out</button>
  </header>
  <div class="panes">
    <aside class="list" aria-label="Email chains">
      <div class="filters">
        <input class="field" id="q" type="search" placeholder="Search" aria-label="Search chains">
        <select class="field" id="statusFilter" aria-label="Status" style="max-width:130px">
          <option value="active">To do</option><option value="all">All</option><option value="open">Open</option><option value="answered">Answered</option><option value="done">Done</option>
        </select>
      </div>
      <div id="rows" role="list"></div>
    </aside>
    <main class="view" id="view"><p class="empty">Choose a chain.</p></main>
  </div>
</div>

<script>
(function(){
var API="https://fider-feedback-api.vercel.app/api/support-admin", KEY="mp-desk";
var $=function(id){return document.getElementById(id)};
var state={pw:"",tab:"esc",activity:[],threads:[],cur:null,thread:null,flat:[],picked:[],storage:true,timer:0};
try{state.pw=sessionStorage.getItem(KEY)||""}catch(e){}

function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function when(iso){var d=new Date(iso);return isNaN(d)?"":d.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function call(method,query,body){
  return fetch(API+(query||""),{method:method,headers:Object.assign({Authorization:"Bearer "+state.pw},body?{"Content-Type":"application/json"}:{}),body:body?JSON.stringify(body):undefined})
   .then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(r.status===401){signOut(true);throw new Error("Wrong password.")}if(!r.ok)throw new Error(j.error||"Something went wrong.");return j})});
}
function signOut(keepMsg){
  state.pw="";try{sessionStorage.removeItem(KEY)}catch(e){}
  clearInterval(state.timer);$("app").hidden=true;$("login").hidden=false;if(!keepMsg)$("loginErr").textContent="";$("pw").value="";$("pw").focus();
}
$("loginForm").addEventListener("submit",function(e){
  e.preventDefault();state.pw=$("pw").value;$("loginErr").textContent="";
  loadList().then(function(){try{sessionStorage.setItem(KEY,state.pw)}catch(e){}start()}).catch(function(err){$("loginErr").textContent=err.message;state.pw=""});
});
$("signout").addEventListener("click",function(){signOut(false)});
$("compose").addEventListener("click",function(){state.cur=null;state.thread=null;$("app").setAttribute("data-open","true");renderCompose()});
$("refresh").addEventListener("click",function(){loadList().then(function(){if(state.cur)openThread(state.cur,true)}).catch(showErr)});
$("q").addEventListener("input",renderList);$("statusFilter").addEventListener("change",renderList);
document.querySelectorAll(".tab").forEach(function(b){b.addEventListener("click",function(){setTab(b.dataset.tab)})});

function setTab(t){
  state.tab=t;document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===t))});
  $("statusFilter").hidden=t!=="esc";$("app").dataset.tab=t;
  $("app").removeAttribute("data-open");state.cur=null;state.thread=null;$("view").replaceChildren(el("p","empty","Choose a chain."));
  if(t==="settings"){renderSettings();return}
  renderList();
}
function showErr(err){var v=$("view");var n=el("p","err",err.message);v.prepend(n)}

function loadList(){
  return call("GET").then(function(j){state.storage=j.storage!==false;state.threads=j.threads||[];renderList()});
}
function visible(){
  var q=$("q").value.trim().toLowerCase(),f=$("statusFilter").value;
  return state.threads.filter(function(t){
    if(t.kind==="toby")return false;
    if(state.tab==="esc"){
      if(!t.escalated)return false;
      if(f==="active"&&t.status==="done")return false;
      if(f!=="active"&&f!=="all"&&t.status!==f)return false;
    }
    return !q||(t.customer+" "+(t.name||"")+" "+t.subject+" "+t.preview).toLowerCase().indexOf(q)>-1;
  });
}
function renderList(){
  var open=state.threads.filter(function(t){return t.escalated&&t.status==="open"}).length;
  $("openCount").textContent=open;$("openCount").hidden=!open;document.title=(open?"("+open+") ":"")+"Escalations desk";
  var box=$("rows");box.replaceChildren();
  if(!state.storage){var n=el("div","note","Storage is not connected yet, so no chains can be shown. Connect a Vercel Blob store to the feedback-api project (see the setup notes).");box.append(n);return}
  var rows=visible();
  if(!rows.length){box.append(el("p","empty",state.tab==="esc"?"No escalations here.":"No email chains yet."));return}
  rows.forEach(function(t){
    var b=el("button","row");b.type="button";b.setAttribute("role","listitem");if(t.id===state.cur)b.setAttribute("aria-current","true");
    var top=el("div","row__top"),who=el("span","row__who",t.name?t.name+" ("+t.customer+")":t.customer);
    top.append(who,el("span",null,when(t.updatedAt)));
    var tags=el("div","row__sub");tags.textContent=t.subject;
    var meta=el("div","row__top");
    var left=el("span");
    if(t.escalated){var p=el("span","pill pill--"+(t.status==="open"?"open":t.status==="answered"?"answered":""),t.status);left.append(p);left.append(" ")}
    if(state.tab==="all"&&t.escalated){left.append(el("span","pill pill--esc","escalated"))}
    if(!t.escalated)left.append(el("span","pill","bot"));
    if(waiting(t.scheduledAt)){left.append(" ");left.append(el("span","pill pill--wait","reply scheduled"))}
    if(t.files){left.append(" ");var fp=el("span","pill",t.files+(t.files===1?" file":" files"));fp.title="Attachments in this chain";left.append(fp)}
    if(t.pendingBot){left.append(" ");var wp=el("span","pill pill--wait","reply waiting");wp.title="The bot is waiting for the virus scans before it replies";left.append(wp)}
    meta.append(left,el("span",null,t.count+" message"+(t.count===1?"":"s")));
    b.append(top,tags,el("div","row__pre",t.preview),meta);
    b.addEventListener("click",function(){openThread(t.id)});
    box.append(b);
  });
}

function waiting(iso){return !!iso&&Date.parse(iso)>Date.now()}
function openThread(id,quiet){
  state.cur=id;if(!quiet)$("app").setAttribute("data-open","true");
  return call("GET","?id="+encodeURIComponent(id)).then(function(j){state.thread=j.thread;state.activity=j.activity||[];renderThread();renderList()}).catch(showErr);
}
var ACT={refund_request:"Refund request",refund:"Refund",cancellation:"Cancellation",device_removed:"Device removed",key_resent:"Licence key email"};
function whenFull(iso){var d=new Date(iso);return isNaN(d)?"":d.toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function activityPanel(t){
  var list=state.activity||[],d=document.createElement("details");d.className="act";d.open=true;
  d.append(el("summary",null,"Account activity for "+t.customer+" ("+list.length+")"));
  var ul=el("ul");
  if(!list.length){var e=el("li",null,"Nothing recorded for this email address (refund requests, cancellations, device removals, licence key emails). If they wrote from a different address to the one they paid with, there will be none.");ul.append(e)}
  list.forEach(function(a){
    var li=el("li"),top=el("div","top"),bad=/fail|not completed/.test(a.status);
    top.append(el("time",null,whenFull(a.at)),el("b",null,ACT[a.type]||a.type),el("span","pill"+(bad?" pill--open":a.status==="completed"?" pill--answered":""),a.status),el("span",null,a.summary));
    li.append(top);
    var extra=[a.detail,a.key?"Key "+a.key:""].filter(Boolean).join(" - ");
    if(extra)li.append(el("small",null,extra));
    ul.append(li);
  });
  d.append(ul);return d;
}
function gbp(p){return "\u00a3"+(p/100).toFixed(2)}
function refundPanel(t){
  var d=document.createElement("details");d.className="act pay";
  d.append(el("summary",null,"Refund a payment"));
  var body=el("div");d.append(body);
  var msg=el("p","err");msg.setAttribute("role","status");msg.style.padding="0 14px";
  function load(){
    body.replaceChildren(el("p","hint","Loading their payments..."));body.firstChild.style.padding="0 14px 10px";
    call("GET","?id="+encodeURIComponent(t.id)+"&view=payments").then(function(j){draw(j.payments)}).catch(function(e){body.replaceChildren(el("p","err",e.message))});
  }
  function draw(list){
    body.replaceChildren();
    var h=el("p","hint","Payments GoCardless holds under "+t.customer+". This forces a refund whatever the 14-day rules say, straight to their bank, and is logged above. Only cleared payments can be refunded.");h.style.padding="0 14px 8px";body.append(h);
    if(!list.length){var n=el("p","hint","No payments found under this email address.");n.style.padding="0 14px 10px";body.append(n);return}
    var wrap=el("div","tbl"),tb=document.createElement("table"),th=document.createElement("tr");
    ["Date","Payment","Amount","Refunded","Status",""].forEach(function(x){th.append(el("th",null,x))});tb.append(th);
    list.forEach(function(p){
      var tr=document.createElement("tr"),act=el("td");
      [p.date,p.description||"(no description)",gbp(p.amount),p.refunded?gbp(p.refunded):"-",p.status.replace(/_/g," ")].forEach(function(x){tr.append(el("td",null,x))});
      if(p.refundable){var b=el("button","btn btn--sm","Refund...");b.type="button";b.addEventListener("click",function(){form(p)});act.append(b)}
      tr.append(act);tb.append(tr);
    });
    wrap.append(tb);body.append(wrap);
    var fbox=el("div");fbox.id="refundForm";body.append(fbox,msg);
    if(state.refundMsg){msg.style.color="var(--ok)";msg.textContent=state.refundMsg;state.refundMsg=""}
  }
  function form(p){
    var left=p.amount-p.refunded,f=el("form"),box=document.getElementById("refundForm");
    var amt=el("input","field num");amt.type="number";amt.step="0.01";amt.min="0.01";amt.max=(left/100).toFixed(2);amt.value=(left/100).toFixed(2);amt.setAttribute("aria-label","Amount to refund in pounds");amt.style.maxWidth="110px";

      var rd=new FileReader();
      rd.onload=function(){
        call("POST","",{action:"upload",id:state.cur,name:f.name,type:f.type,data:String(rd.result).split(",")[1]||""}).then(function(j){state.thread=j.thread;renderThread();var m2=document.getElementById("sendMsg");if(m2){m2.style.color="";m2.textContent="Uploaded "+f.name+". Waiting for the virus scan."}}).catch(function(e){m.textContent=e.message}).then(function(){next(i+1)});
      };
      rd.onerror=function(){m.textContent="Couldn't read "+f.name+".";next(i+1)};
      rd.readAsDataURL(f);
    })(0);
  });
  var row=el("div","send"),send=el("button","btn","Send reply"),done=el("button","btn btn--done","Send & mark as done"),msg=el("span","err");
  send.type="submit";done.type="button";msg.id="sendMsg";msg.setAttribute("role","status");row.append(send,done,msg);c.append(row);
  c.append(el("p","hint","Send & mark as done closes the case: it gets a case number, replies to that email will not be received, and the email says to contact support to re-open it."));
  function go(close){
    var text=ta.value.trim();if(!text){msg.textContent="Write a reply first.";return}
    var badScan=drafts.filter(function(d){var st=d.scan&&d.scan.status;return st!=="clean"&&st!=="queued"&&st!=="pending"});
    if(badScan.length){msg.style.color="";msg.textContent=badScan[0].name+" can't be sent ("+(badScan[0].scan&&badScan[0].scan.status==="flagged"?"VirusTotal flagged it":"its scan failed or never ran")+"). Remove it, or use Scan again.";return}
    if(state.thread&&state.thread.heldReply){msg.style.color="";msg.textContent="A reply is already queued. Cancel it first.";return}
    if(close&&!confirm("Send this reply and close the case? The customer will be given a case number, and replies to the email will not be received."))return;
    send.disabled=done.disabled=true;msg.style.color="";msg.textContent="Sending...";
    call("POST","",{action:"reply",id:state.cur,sender:fsel.value,text:text,close:close,guides:state.picked.map(function(p){return p.slug}),attachments:drafts.map(function(d){return d.id})}).then(function(j){
      state.picked=[];ta.value="";state.thread=j.thread;renderThread();loadList();
      var m=document.getElementById("sendMsg");if(m){m.style.color="var(--ok)";m.textContent=j.held?"Queued. It sends by itself once every file is virus-free.":close?"Sent and closed, case "+j.thread.caseNumber+".":"Sent."}
    }).catch(function(err){send.disabled=done.disabled=false;msg.style.color="";msg.textContent=err.message});
  }
  c.addEventListener("submit",function(e){e.preventDefault();go(false)});
  done.addEventListener("click",function(){go(true)});
  setTimeout(renderChips,0);
  return c;
}
function renderChips(){
  var box=document.getElementById("chips");if(!box)return;box.replaceChildren();
  state.picked.forEach(function(p,i){
    var c=el("span","chip",p.title),x=el("button",null,"×");x.type="button";x.setAttribute("aria-label","Remove "+p.title);
    x.addEventListener("click",function(){state.picked.splice(i,1);renderChips()});c.append(x);box.append(c);
  });
}

    var tb=el("button","btn btn--sm","Send a test");tb.type="button";var rb=el("button","btn btn--sm btn--ghost","Send the testing key");rb.type="button";var tm=el("span","err");tm.setAttribute("role","status");tr.append(te,tb,rb,tm);w.append(tr);
    function sendKey(real,btn){

      tm.style.color="";tm.textContent="Sending...";tb.disabled=rb.disabled=true;
      call("POST","",{action:"test-key-email",to:te.value,real:real}).then(function(){tm.style.color="var(--ok)";tm.textContent="Sent. Check that inbox (and its spam folder)."}).catch(function(e){tm.textContent=e.message}).then(function(){tb.disabled=rb.disabled=false});

function setStatus(s){
  var silent=false;
  if(s==="done"&&state.thread&&state.thread.status!=="done"&&(state.thread.messages||[]).some(function(m){return m.dir==="in"})){
    if(!confirm("Mark this done? The customer will be emailed that their case is closed, with its case number."))return;
  }
  call("POST","",{action:"status",id:state.cur,status:s,silent:silent}).then(function(j){state.thread=j.thread;renderThread();loadList()}).catch(showErr);
}
function loadGuides(){
  return fetch("/guide/tree.json").then(function(r){return r.json()}).then(function(t){
    state.flat=[];
    t.groups.forEach(function(g){
      g.topics.forEach(function(top){
        [top].concat(top.children||[]).forEach(function(x){state.flat.push({slug:x.slug,title:x.title,summary:x.summary||"",keywords:(x.keywords||[]).map(function(k){return k.toLowerCase()}),group:g.title})});
      });
    });
  }).catch(function(){state.flat=[]}).then(function(){
    return fetch("/marketplace-api/lib/guidelines.json").then(function(r){return r.json()}).then(function(g){
      g.sections.forEach(function(s){s.items.forEach(function(i){state.flat.push({slug:"mg:"+i.id,title:"Guideline "+i.id+": "+i.title,summary:i.text,keywords:["marketplace","guideline","merchant","seller"],group:"Marketplace guidelines"})})});
    }).catch(function(){});
  });
}
function start(){
  $("login").hidden=true;$("app").hidden=false;
  var want=new URLSearchParams(location.search).get("t");
  loadGuides().then(function(){
    setTab("esc");
    if(want){$("statusFilter").value="all";renderList();openThread(want)}
  });
  clearInterval(state.timer);state.timer=setInterval(function(){loadList().catch(function(){})},60000);
}
if(state.pw){loadList().then(start).catch(function(){$("login").hidden=false})}else{$("pw").focus()}
})();
