<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Add music | Maestro Pro Marketplace</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="stylesheet" href="/assets/maestro.css">
<link rel="stylesheet" href="/assets/marketplace.css">
</head>
<body class="read">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="top__brand" href="/"><img width="160" height="160" src="/assets/app-icon-160.png" alt="">Maestro Pro</a>
  <nav class="top__links" aria-label="Primary"><a href="/marketplace/">Marketplace</a></nav>
</header>
<main id="main" class="plain">
<h1>Add music</h1>
<p>For the site owner. Pieces added here are paid straight to the Maestro Pro Mollie account.</p>
<form id="auth" class="pay"><label class="field">Admin key<input name="k" type="password" autocomplete="current-password"></label><button class="pay__btn pay__btn--ghost" type="submit">Use this key</button></form>
<form id="f" class="pay pay--wide" hidden></form>
</main>
<footer class="foot">
  <nav aria-label="Footer"><a href="/">Maestro Pro</a><a href="/support/">Support</a><a href="/privacy/">Privacy</a></nav>
  <p>&copy; <span id="yr">2026</span> The Caffeine Media Company.</p>
</footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear()</script>
<script src="/assets/nav.js" defer></script>
<script type="module">
import { mountBuilder, builderFields } from "/assets/marketplace.js";
const K = "mp-admin-key", f = document.getElementById("f"), a = document.getElementById("auth");
let key = ""; try { key = localStorage.getItem(K) || ""; } catch {}
f.innerHTML = builderFields;
mountBuilder(f, { getKey: () => key });
const show = () => { f.hidden = !key; };
a.addEventListener("submit", (e) => { e.preventDefault(); key = a.k.value.trim(); try { localStorage.setItem(K, key); } catch {} show(); });
show();
</script>
</body>
</html>
